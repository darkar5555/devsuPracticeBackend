services:
  postgres:
    image: postgres:17-alpine
    container_name: devsu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsu_bank}
      POSTGRES_USER: ${POSTGRES_USER:-devsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsu123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../BaseDatos.sql:/docker-entrypoint-initdb.d/01-BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-devsu} -d ${POSTGRES_DB:-devsu_bank}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
